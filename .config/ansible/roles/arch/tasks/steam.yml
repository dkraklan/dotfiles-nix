---
- name: Install packages
  community.general.pacman:
    name: "{{ item }}"
    state: present
  with_items:
    - steam
    - nvidia-utils
    - lib32-nvidia-utils
    - nvidia-settings
    - vulkan-icd-loader
    - lib32-vulkan-icd-loader
    - ttf-liberation
    - lib32-pipewire
    - gamemode
    - lib32-gamemode
    - gamescope
    - mangohud


