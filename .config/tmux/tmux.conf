#Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %


# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf\; display-message "Config reloaded..."


# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

#vim like pane switching
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

#Kill current session
bind X confirm-before -p "Kill current session?" kill-session

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Window naming configuration
set-option -g automatic-rename off
set-option -g allow-rename off
setw -g automatic-rename off
setw -g allow-rename off

# enable vi status keys
setw -g mode-keys vi

# Window naming configuration
# set-option -g automatic-rename off
# set-option -g allow-rename off
# setw -g automatic-rename off
# setw -g allow-rename off
# Enable automatic window renaming
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{b:pane_current_command}'

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

set -g @plugin 'dracula/tmux'
set -g @plugin 'alexwforsythe/tmux-which-key'  

set -g @dracula-show-powerline true
set -g @dracula-show-edge-icons true
set -g status-justify centre

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.config/tmux/plugins/tpm/tpm'
